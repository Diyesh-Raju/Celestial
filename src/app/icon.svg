<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Favicon: the taupe mark (paths from src/lib/logo.ts) on a burgundy tile, matching
       app/apple-icon.tsx. Self-contained so it reads on light and dark tab strips alike: the favicon's
       prefers-color-scheme follows the OS, not the browser theme, so a bare mark can't adapt. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2340"/>
      <stop offset="0.55" stop-color="#561226"/>
      <stop offset="1" stop-color="#360a16"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="10.5" fill="url(#bg)"/>
  <g fill="#E8E0D8" stroke="#E8E0D8" transform="translate(5.76 5.76) scale(0.76)">
    <path d="M42.47 35.53A20.1 20.1 0 1 1 42.47 12.47" fill="none" stroke-width="3.3"/>
    <path d="M25.71 13.3A10.7 10.7 0 1 0 33.81 31.23A10.44 10.44 0 0 1 25.71 13.3Z" stroke="none"/>
    <path d="M30.8 19.72Q31.15 21.97 33.4 22.32Q31.15 22.67 30.8 24.92Q30.45 22.67 28.2 22.32Q30.45 21.97 30.8 19.72Z" stroke="none"/>
  </g>
</svg>
