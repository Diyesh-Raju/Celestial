<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.5 3.5 41 41">
  <!-- Favicon: the bare burgundy mark (paths from src/lib/logo.ts), no tile, cropped to the
       mark so it fills the tab icon. Burgundy disappears on dark tab strips, so it switches to
       the brand rose when the OS is in dark mode (a favicon's prefers-color-scheme follows the
       OS, not the browser theme). -->
  <style>
    .c { stroke: #561226; }
    .d { fill: #561226; }
    @media (prefers-color-scheme: dark) {
      .c { stroke: #c4798b; }
      .d { fill: #c4798b; }
    }
  </style>
  <path class="c" d="M22 7.25A16.75 16.75 0 0 0 22 40.75" fill="none" stroke-width="3.5"/>
  <path class="d" d="M26 5.5A18.5 18.5 0 0 1 26 42.5Z"/>
</svg>
